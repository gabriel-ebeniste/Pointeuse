<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Heures">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e8590c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>Suivi Heures</title>
<style>
:root{--bg:#f3f1ee;--c:#fff;--t:#1c1b1a;--s:#77716a;--a:#e8590c;--at:#fde3d3;--l:#e4e0db}
@media(prefers-color-scheme:dark){:root{--bg:#141312;--c:#211f1d;--t:#f4f1ed;--s:#a29b92;--a:#ff8a4c;--at:#4a2a18;--l:#383431}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.35 -apple-system,system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--t);padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:12px}
.card{background:var(--c);border-radius:14px;padding:4px 14px;margin:0 0 10px}
h2{font-size:14px;font-weight:600;color:var(--s);margin:18px 4px 6px}
.r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--l)}
.r:last-child{border:0}
.tap{cursor:pointer}
small,.mu{color:var(--s)}
.seg{display:flex;background:var(--l);border-radius:10px;padding:3px;margin:0 0 10px}
.seg button{flex:1;border:0;background:none;padding:9px 2px;font-size:14px;border-radius:8px;color:var(--t);font:inherit}
.seg .on{background:var(--c);font-weight:600;box-shadow:0 1px 3px #0003}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
.pb{border:0;border-radius:12px;background:var(--at);color:var(--t);padding:14px 8px;font:inherit}
.pb:active{transform:scale(.97)}
.pb b{display:block;font-size:22px;font-variant-numeric:tabular-nums;margin-top:2px}
input,textarea{font:inherit;color:var(--t);background:var(--bg);border:0;border-radius:8px;padding:7px 9px;max-width:100%}
input[type=number]{width:84px;text-align:right}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--a)}
textarea{width:100%;margin:8px 0;min-height:60px}
.lk{border:0;background:none;color:var(--a);font:inherit;padding:2px 0}
.rd{color:#d92d20}
.tp{padding:10px 0;border-bottom:1px solid var(--l);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tp label{width:100%}.tp input[type=time]{flex:1;min-width:0;padding:7px 4px}
.big{display:block;width:100%;border:0;border-radius:12px;background:var(--a);color:#fff;padding:14px;font:600 16px inherit;margin:0 0 10px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--c);border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:12px 4px;font:600 13px -apple-system,system-ui,sans-serif;color:var(--s)}
nav .on{color:var(--a)}
</style>
</head>
<body>
<main id="app"></main>
<nav>
<button data-t="p" onclick="V.tab='p';render()">Pointage</button>
<button data-t="h" onclick="V.tab='h';render()">Historique</button>
<button data-t="s" onclick="V.tab='s';render()">Réglages</button>
</nav>
<script>
const K='suiviheures.v1',$=s=>document.querySelector(s),p=n=>String(n).padStart(2,'0'),cl=x=>JSON.parse(JSON.stringify(x));
const T=(s,lo,li,e,w=1)=>({w,s,lo,li,e}),D4=()=>T('08:15','12:00','13:00','17:00'),FR=(w=1)=>T('08:15','','','12:15',w),E8=()=>T('08:00','12:00','13:45','17:45');
const DEF={bonus:10,rate:0,thr:8,r1:25,r2:50,truckIn:false,mealStd:60,mealRed:30,
 tpl:[D4(),D4(),D4(),D4(),FR(),FR(0),FR(0)],
 tplE:[T('09:00','12:00','13:45','17:45'),E8(),E8(),E8(),T('08:00','','','12:00'),T('08:00','','','12:00',0),T('08:00','','','12:00',0)]};
let S,A={},E={};
try{const o=JSON.parse(localStorage[K]);S={days:o.days||{},set:{...cl(DEF),...o.set},since:o.since,v:o.v}}catch(e){S={days:{},set:cl(DEF),v:2}}
const save=()=>{localStorage[K]=JSON.stringify(S)};
const V={tab:'p',date:null,h:'m'};
const iso=d=>d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
const TD=()=>iso(new Date());V.date=TD();
const P=s=>new Date(s+'T12:00:00'),wdi=d=>(d.getDay()+6)%7;
const addD=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return iso(d)};
const wd=s=>wdi(P(s)),ws=s=>addD(s,-wd(s));
const fd=s=>P(s).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
const fs=s=>P(s).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
const fm=mo=>P(mo+'-01').toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
const wkn=s=>{const d=P(s);d.setDate(d.getDate()+3-wdi(d));const y=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-y)/864e5-3+wdi(y))/7)};
const wt=w=>`Semaine ${wkn(w)} · ${fs(w)} – ${fs(addD(w,6))}`;
const m=t=>t?+t.slice(0,2)*60+ +t.slice(3,5):null;
const hm=x=>{x=Math.max(0,Math.round(x));return Math.floor(x/60)+'h'+p(x%60)},sh=x=>(x<0?'−':'')+hm(Math.abs(x));
const eur=v=>v.toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
const TYn={normal:'Normale',chantier:'Chantier',ecole:'École',cp:'Congé',rec:'Récup'},JN=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const LB={o:[['s','Arrivée'],['lo','Début pause'],['li','Fin pause'],['e','Départ']],c:[['dep','Départ entreprise'],['arr','Arrivée chantier'],['lea','Départ chantier'],['ret','Retour entreprise']]};
const OI=['s','lo','li','e'],CI=['dep','arr','lea','ret'];

/* ---------- Calculs ---------- */
const span=(a,b)=>a==null||b==null?0:b>=a?b-a:b+1440-a;
const tm=t=>!t.w?0:(t.lo&&t.li?m(t.lo)-m(t.s)+m(t.e)-m(t.li):m(t.e)-m(t.s))||0;
const ref=s=>Math.max(0,tm(S.set.tpl[wd(s)]));
const baseMin=k=>S.set[k||'tpl'].reduce((a,t)=>a+Math.max(0,tm(t)),0);
function office(t){const s=m(t.s),lo=m(t.lo),li=m(t.li),e=m(t.e);if(s==null)return 0;
 if(lo!=null){let x=Math.max(0,lo-s);if(li!=null&&e!=null)x+=Math.max(0,e-li);return x}
 return e!=null?Math.max(0,e-s):0}
function raw(s,d){const t=d.t,r=ref(s),ex=(d.x||[]).reduce((a,q)=>a+span(m(q.s),m(q.e)),0),o={n:0,o:0,tr:0,cp:0,rc:0};
 if(d.type=='chantier'){const a=m(t.arr),l=m(t.lea),site=a!=null&&l!=null?Math.max(0,span(a,l)-d.meal):0;
  o.n=Math.min(site,r);o.o=Math.max(0,site-r)+ex;o.tr=(d.ng?0:span(m(t.dep),a))+(d.nb?0:span(l,m(t.ret)))}
 else if(d.type=='ecole')o.n=office(t);
 else if(d.type=='cp')o.cp=d.h??r;
 else if(d.type=='rec')o.rc=d.h??r;
 else{const w=office(t);o.n=Math.min(w,r);o.o=Math.max(0,w-r)+ex}
 return o}
function tpl(d,s){const t=S.set[d.type=='ecole'?'tplE':'tpl'][wd(s)];OI.forEach(k=>delete d.t[k]);if(t.w)OI.forEach(k=>{if(t[k])d.t[k]=t[k]})}
function vd(s){const d={type:'normal',t:{},x:[],meal:S.set.mealStd,red:false,night:false,ng:0,nb:0};tpl(d,s);return d}
const elig=s=>S.set.tpl[wd(s)].w&&s>=S.since&&s<=TD();
function all(){const R={};for(let s=S.since,n=0;s<=TD()&&n<800;s=addD(s,1),n++)if(elig(s))R[s]=vd(s);return Object.assign(R,S.days)}
function evalAll(){const R={},W={},th=S.set.thr*60;
 for(const s in A)(W[ws(s)]??=[]).push(s);
 const sp=(x,c)=>{const l=Math.min(x,Math.max(0,th-c.v));c.v+=x;return[l,x-l]};
 for(const k in W){const c={v:0};
  for(const s of W[k].sort()){const d=A[s],o=raw(s,d),e={n:o.n,cp:o.cp,rec:o.rc,night:d.type=='chantier'&&!!d.night};
   [e.o1,e.o2]=sp(o.o,c);
   if(S.set.truckIn){[e.c1,e.c2]=sp(o.tr,c)}else{e.c1=o.tr;e.c2=0}
   R[s]=e}}
 return R}
const tot=l=>{const t={n:0,cp:0,rec:0,o1:0,o2:0,c1:0,c2:0,nt:0};
 for(const s of l){const e=E[s];if(!e)continue;for(const k of['n','cp','rec','o1','o2','c1','c2'])t[k]+=e[k];if(e.night)t.nt++}return t};
function net(t){const f1=1+S.set.r1/100,f2=1+S.set.r2/100;let r=t.rec;
 const d2=Math.min(t.o2,r/f2);r-=d2*f2;const d1=Math.min(t.o1,r/f1);r-=d1*f1;
 return{o1:t.o1-d1,o2:t.o2-d2,ex:Math.max(0,r)}}
const rw=(a,b)=>`<div class="r"><span>${a}</span><b>${b}</b></div>`;
function sum(t,base){const c=S.set,a=100+c.r1,b=100+c.r2,q=net(t),pn=t.n+t.cp+t.rec;
 let h=rw('Heures normales',hm(t.n)+(base?' / '+hm(base):''));
 if(t.cp)h+=rw('Congés payés',hm(t.cp));
 h+=rw('Heures sup à '+a+' %',hm(t.o1))+rw('Heures sup à '+b+' %',hm(t.o2));
 if(t.rec){h+=rw('Récupérations prises',hm(t.rec))+rw('Heures sup restantes à '+a+' %',hm(q.o1))+rw('Heures sup restantes à '+b+' %',hm(q.o2));
  if(q.ex>0)h+=rw('Récup non couverte par les heures sup',hm(q.ex))}
 h+=rw('Heures de camion à '+a+' %',hm(t.c1))+rw('Heures de camion à '+b+' %',hm(t.c2))+rw('Nuits en découcher',t.nt)+rw('Prime de nuit',eur(t.nt*c.bonus));
 if(c.rate>0){const e1=pn/60*c.rate,e2=((q.o1+t.c1)*(1+c.r1/100)+(q.o2+t.c2)*(1+c.r2/100))/60*c.rate;
  h+=rw('Estimation heures normales',eur(e1))+rw('Estimation sup + camion',eur(e2))+rw('Total estimé (brut)',eur(e1+e2+t.nt*c.bonus))}
 return h}

/* ---------- Actions ---------- */
const ens=()=>S.days[V.date]||(S.days[V.date]=cl(A[V.date])),done=()=>{save();render()};
const go=s=>{V.date=s;V.tab='p';render()};
function mk(t){const d={type:t,t:{},x:[],meal:S.set.mealStd,red:false,night:false,ng:0,nb:0};S.days[V.date]=d;if(t=='normal'||t=='ecole')tpl(d,V.date);done()}
function ty(t){const d=ens();d.type=t;if(t=='chantier')OI.forEach(k=>delete d.t[k]);else{CI.forEach(k=>delete d.t[k]);d.ng=d.nb=0}
 if(t=='normal'||t=='ecole')tpl(d,V.date);if(t=='ecole')d.x=[];done()}
function pu(k){ens().t[k]=new Date().toTimeString().slice(0,5);done()}
function setT(k,v){const d=ens();v?d.t[k]=v:delete d.t[k];done()}
function up(k,v){ens()[k]=v;done()}
function fl(k,v){const d=ens();d[k]=v;if(v)delete d.t[k=='ng'?'dep':'ret'];done()}
function rd(on){const d=ens();d.red=on;d.meal=on?S.set.mealRed:S.set.mealStd;done()}
function ax(){const d=ens(),l=(d.x||[]).slice(-1)[0];(d.x=d.x||[]).push({s:(l&&l.e)||d.t.ret||d.t.e||'',e:''});done()}
function rx(i){ens().x.splice(i,1);done()}
function sx(i,k,v){ens().x[i][k]=v;done()}
function rf(){tpl(ens(),V.date);done()}
function clr(){const d=ens();OI.forEach(k=>delete d.t[k]);done()}
function del(){if(confirm(elig(V.date)?'Rétablir la journée normale par défaut ?':'Supprimer cette journée ?')){delete S.days[V.date];done()}}
function cfg(k,v){S.set[k]=typeof v=='boolean'?v:(+String(v).replace(',','.')||0);done()}
function tc(k,i,f,v){S.set[k][i][f]=v;done()}
function rst(){if(confirm('Effacer toutes les saisies (les journées normales par défaut reviendront) ?')){S.days={};done()}}
function csv(){const f=x=>(x/60).toFixed(2).replace('.',','),a=100+S.set.r1,b=100+S.set.r2;
 const L=['Date;Type;Heures normales;Congés;Récup;Sup '+a+'%;Sup '+b+'%;Camion '+a+'%;Camion '+b+'%;Nuit'];
 Object.keys(A).sort().forEach(s=>{const e=E[s];L.push([s,TYn[A[s].type],f(e.n),f(e.cp),f(e.rec),f(e.o1),f(e.o2),f(e.c1),f(e.c2),e.night?1:0].join(';'))});
 const u=URL.createObjectURL(new Blob(['\ufeff'+L.join('\n')],{type:'text/csv'})),k=document.createElement('a');k.href=u;k.download='heures.csv';k.click()}

/* ---------- Vues ---------- */
function pv(){const d=A[V.date];
 let h=`<div class="card"><div class="r"><input type="date" value="${V.date}" onchange="V.date=this.value||TD();render()"><button class="lk" onclick="V.date=TD();render()">Aujourd’hui</button></div></div>`;
 if(!d)h+=`<h2>${fd(V.date)} : choisis le type de journée</h2>`+Object.entries(TYn).map(([k,n])=>`<button class="big" onclick="mk('${k}')">${n}</button>`).join('');
 else{const c=d.type=='chantier',lv=d.type=='cp'||d.type=='rec',e=E[V.date],L=c?LB.c:LB.o,hid=k=>(k=='dep'&&d.ng)||(k=='ret'&&d.nb);
  h+=`<div class="seg">${Object.entries(TYn).map(([k,n])=>`<button class="${d.type==k?'on':''}" onclick="ty('${k}')">${n}</button>`).join('')}</div>`;
  if(lv)h+=`<h2>${d.type=='cp'?'Congé payé':'Récupération'}</h2><div class="card"><div class="r"><span>Durée</span><span><input type="number" inputmode="decimal" step="0.25" value="${(d.h??ref(V.date))/60}" onchange="up('h',Math.max(0,Math.round((+String(this.value).replace(',','.')||0)*60)))"> h</span></div>
   <div class="r"><small>${d.type=='cp'?'Compté comme heures normales payées.':'Payée comme du temps normal. Elle est prise d’abord sur les heures sup à '+(100+S.set.r2)+' % (1 h compte pour 1h30 de repos), puis sur celles à '+(100+S.set.r1)+' % (1 h compte pour 1h15). Pas sur le camion.'} Par défaut : la durée de la journée.</small></div></div>`;
  else{
   h+=`<h2>Pointage rapide (heure actuelle)</h2><div class="card g">${L.filter(([k])=>!hid(k)).map(([k,n])=>`<button class="pb" onclick="pu('${k}')">${n}<b>${d.t[k]||'—'}</b></button>`).join('')}</div>`;
   h+=`<h2>Horaires</h2><div class="card">`+L.map(([k,n])=>hid(k)?'':`<div class="r"><span>${n}</span><span><input type="time" value="${d.t[k]||''}" onchange="setT('${k}',this.value)">${k=='dep'?`<button class="lk rd" title="Pas de trajet aller" onclick="fl('ng',1)"> −</button>`:k=='ret'?`<button class="lk rd" title="Pas de trajet retour" onclick="fl('nb',1)"> −</button>`:''}</span></div>`).join('');
   if(c&&d.ng)h+=`<div class="r"><button class="lk" onclick="fl('ng',0)">+ Rétablir le trajet aller</button></div>`;
   if(c&&d.nb)h+=`<div class="r"><button class="lk" onclick="fl('nb',0)">+ Rétablir le trajet retour</button></div>`;
   if(!c)h+=`<div class="r"><button class="lk" onclick="rf()">${d.type=='ecole'?'Horaires école':'Horaires de référence'}</button><button class="lk rd" onclick="clr()">Effacer</button></div>`;
   h+='</div>';
   if(d.type!='ecole')h+=`<h2>Heures sup en plus (débriefing, déchargement…)</h2><div class="card">`+(d.x||[]).map((q,i)=>`<div class="r"><span>De <input type="time" value="${q.s||''}" onchange="sx(${i},'s',this.value)"> à <input type="time" value="${q.e||''}" onchange="sx(${i},'e',this.value)"></span><button class="lk rd" onclick="rx(${i})">−</button></div>`).join('')+`<div class="r"><button class="lk" onclick="ax()">+ Ajouter une ligne</button></div></div>`;
   if(c)h+=`<h2>Repas et nuit</h2><div class="card"><label class="r"><span>Temps de repas réduit</span><input type="checkbox" ${d.red?'checked':''} onchange="rd(this.checked)"></label>
    <div class="r"><span>Pause repas</span><span><input type="number" inputmode="numeric" value="${d.meal}" onchange="up('meal',Math.max(0,+this.value||0))"> min</span></div>
    <label class="r"><span>Nuit sur place (découcher)</span><input type="checkbox" ${d.night?'checked':''} onchange="up('night',this.checked)"></label></div>`}
  h+=`<h2>Récapitulatif du jour</h2><div class="card">`+(lv?rw(d.type=='cp'?'Congé payé':'Récupération',hm(e.cp+e.rec)):rw('Heures normales',hm(e.n))+rw('Heures supplémentaires',hm(e.o1+e.o2))+(e.o2?rw('dont à '+(100+S.set.r2)+' %',hm(e.o2)):'')
   +(c?rw('Heures de camion',hm(e.c1+e.c2))+(d.night?rw('Découcher',eur(S.set.bonus)):'')+((!d.t.arr||!d.t.lea)?'<div class="r"><small>Renseigne l’arrivée et le départ du chantier pour calculer les heures.</small></div>':''):''))+'</div>';
  if(S.days[V.date])h+=`<div class="card"><div class="r"><button class="lk rd" onclick="del()">${elig(V.date)?'Rétablir la journée normale par défaut':'Supprimer cette journée'}</button></div></div>`}
 const mo=V.date.slice(0,7);
 return h+`<h2>Récapitulatif · ${fm(mo)}</h2><div class="card">${sum(tot(Object.keys(A).filter(s=>s.startsWith(mo))))}</div>`}

function hv(){const ks=Object.keys(A);
 let h=`<div class="seg">${[['m','Mois'],['s','Semaines'],['j','Jours']].map(([k,n])=>`<button class="${V.h==k?'on':''}" onclick="V.h='${k}';render()">${n}</button>`).join('')}</div>`;
 if(!ks.length)return h+'<p class="mu">Aucune journée enregistrée.</p>';
 if(V.h=='m'){for(const mo of [...new Set(ks.map(s=>s.slice(0,7)))].sort().reverse())
   h+=`<h2>${fm(mo)}</h2><div class="card">${sum(tot(ks.filter(s=>s.startsWith(mo))))}</div>`;return h}
 for(const w of [...new Set(ks.map(ws))].sort().reverse()){const l=ks.filter(s=>ws(s)==w).sort().reverse();
  h+=`<h2>${wt(w)}</h2><div class="card">`;
  h+=V.h=='s'?sum(tot(l),baseMin()):l.map(s=>{const e=E[s],d=A[s],o=e.o1+e.o2,c=e.c1+e.c2;
   return `<div class="r tap" onclick="go('${s}')"><span>${fd(s)}<br><small>${TYn[d.type]}</small></span><span style="text-align:right">${hm(e.n+e.cp+e.rec)}${e.night?' 🌙':''}<br><small>${o?'sup '+hm(o):''}${o&&c?' · ':''}${c?'camion '+hm(c):''}</small></span></div>`}).join('');
  h+='</div>'}
 return h}

function tpb(k,t){let h=`<h2>${t} · ${hm(baseMin(k))} par semaine</h2><div class="card">`;
 JN.forEach((j,i)=>{const o=S.set[k][i];h+=`<div class="tp"><label><input type="checkbox" ${o.w?'checked':''} onchange="tc('${k}',${i},'w',this.checked)"> <b>${j}</b></label>`
  +(o.w?OI.map((f,x)=>`<input type="time" title="${LB.o[x][1]}" value="${o[f]||''}" onchange="tc('${k}',${i},'${f}',this.value)">`).join(''):'')+'</div>'});
 return h+'</div>'}
function sv(){const c=S.set,n=(k,l,u)=>`<div class="r"><span>${l}</span><span><input type="number" inputmode="decimal" step="any" value="${c[k]}" onchange="cfg('${k}',this.value)"> ${u}</span></div>`;
 return `<h2>Paie</h2><div class="card">${n('rate','Taux horaire brut','€ / h')}${n('bonus','Prime de nuit (par nuit)','€')}</div>
 <h2>Majorations hebdomadaires</h2><div class="card">${n('thr','Seuil d’heures sup','h / sem.')}${n('r1','Majoration de base','%')}${n('r2','Majoration au-delà du seuil','%')}
 <label class="r"><span>Camion compté dans le seuil</span><input type="checkbox" ${c.truckIn?'checked':''} onchange="cfg('truckIn',this.checked)"></label></div>
 <h2>Repas sur chantier</h2><div class="card">${n('mealStd','Repas standard','min')}${n('mealRed','Repas réduit','min')}</div>
 <h2>Remplissage automatique</h2><div class="card"><div class="r"><span>Journées normales dès le</span><input type="date" value="${S.since}" onchange="S.since=this.value||S.since;done()"></div></div>
