<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Heures">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e8590c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>Suivi Heures</title>
<style>
:root{--bg:#f3f1ee;--c:#fff;--t:#1c1b1a;--s:#77716a;--a:#e8590c;--at:#fde3d3;--l:#e4e0db}
@media(prefers-color-scheme:dark){:root{--bg:#141312;--c:#211f1d;--t:#f4f1ed;--s:#a29b92;--a:#ff8a4c;--at:#4a2a18;--l:#383431}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.35 -apple-system,system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--t);padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:12px}
.card{background:var(--c);border-radius:14px;padding:4px 14px;margin:0 0 10px}
h2{font-size:14px;font-weight:600;color:var(--s);margin:18px 4px 6px}
.r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--l)}
.r:last-child{border:0}
.tap{cursor:pointer}
small,.mu{color:var(--s)}
.seg{display:flex;background:var(--l);border-radius:10px;padding:3px;margin:0 0 10px}
.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:8px;color:var(--t);font:inherit}
.seg .on{background:var(--c);font-weight:600;box-shadow:0 1px 3px #0003}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
.pb{border:0;border-radius:12px;background:var(--at);color:var(--t);padding:14px 8px;font:inherit}
.pb:active{transform:scale(.97)}
.pb b{display:block;font-size:22px;font-variant-numeric:tabular-nums;margin-top:2px}
input,textarea{font:inherit;color:var(--t);background:var(--bg);border:0;border-radius:8px;padding:7px 9px;max-width:100%}
input[type=number]{width:84px;text-align:right}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--a)}
textarea{width:100%;margin:8px 0;min-height:60px}
.lk{border:0;background:none;color:var(--a);font:inherit;padding:2px 0}
.rd{color:#d92d20}
.tp{padding:10px 0;border-bottom:1px solid var(--l);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tp label{width:100%}.tp input[type=time]{flex:1;min-width:0;padding:7px 4px}
.big{display:block;width:100%;border:0;border-radius:12px;background:var(--a);color:#fff;padding:14px;font:600 16px inherit;margin:0 0 10px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--c);border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:12px 4px;font:600 13px -apple-system,system-ui,sans-serif;color:var(--s)}
nav .on{color:var(--a)}
</style>
</head>
<body>
<main id="app"></main>
<nav>
<button data-t="p" onclick="V.tab='p';render()">Pointage</button>
<button data-t="h" onclick="V.tab='h';render()">Historique</button>
<button data-t="s" onclick="V.tab='s';render()">Réglages</button>
</nav>
<script>
const K='suiviheures.v1',$=s=>document.querySelector(s),p=n=>String(n).padStart(2,'0'),cl=x=>JSON.parse(JSON.stringify(x));
const T=(s,lo,li,e,w=1)=>({w,s,lo,li,e}),D4=()=>T('08:15','12:00','13:00','17:00'),FR=(w=1)=>T('08:15','','','12:15',w);
const DEF={bonus:0,thr:8,r1:25,r2:50,truckIn:false,mealStd:60,mealRed:30,tpl:[D4(),D4(),D4(),D4(),FR(),FR(0),FR(0)]};
let S,E={};
try{const o=JSON.parse(localStorage[K]);S={days:o.days||{},set:{...cl(DEF),...o.set}}}catch(e){S={days:{},set:cl(DEF)}}
const save=()=>{localStorage[K]=JSON.stringify(S)};
const V={tab:'p',date:null,h:'j'};
const iso=d=>d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
V.date=iso(new Date());
const P=s=>new Date(s+'T12:00:00'),wdi=d=>(d.getDay()+6)%7;
const addD=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return iso(d)};
const wd=s=>wdi(P(s)),ws=s=>addD(s,-wd(s));
const fd=s=>P(s).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
const fs=s=>P(s).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
const wkn=s=>{const d=P(s);d.setDate(d.getDate()+3-wdi(d));const y=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-y)/864e5-3+wdi(y))/7)};
const wt=w=>`Semaine ${wkn(w)} · ${fs(w)} – ${fs(addD(w,6))}`;
const m=t=>t?+t.slice(0,2)*60+ +t.slice(3,5):null;
const hm=x=>{x=Math.max(0,Math.round(x));return Math.floor(x/60)+'h'+p(x%60)};
const eur=v=>v.toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
const TYn={normal:'Normale',chantier:'Chantier',ecole:'École'},JN=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const LB={o:[['s','Arrivée'],['lo','Début pause'],['li','Fin pause'],['e','Départ']],c:[['dep','Départ maison'],['arr','Arrivée chantier'],['lea','Départ chantier'],['ret','Retour maison']]};
const OI=['s','lo','li','e'];

/* ---------- Calculs ---------- */
const span=(a,b)=>a==null||b==null?0:b>=a?b-a:b+1440-a;
const tm=t=>!t.w?0:(t.lo&&t.li?m(t.lo)-m(t.s)+m(t.e)-m(t.li):m(t.e)-m(t.s))||0;
const ref=s=>Math.max(0,tm(S.set.tpl[wd(s)]));
const baseMin=()=>S.set.tpl.reduce((a,t)=>a+Math.max(0,tm(t)),0);
function office(t){const s=m(t.s),lo=m(t.lo),li=m(t.li),e=m(t.e);if(s==null)return 0;
 if(lo!=null){let x=Math.max(0,lo-s);if(li!=null&&e!=null)x+=Math.max(0,e-li);return x}
 return e!=null?Math.max(0,e-s):0}
function raw(s,d){const r=ref(s),t=d.t;
 if(d.type=='chantier'){const a=m(t.arr),l=m(t.lea),tr=span(m(t.dep),a)+span(l,m(t.ret));
  const site=a!=null&&l!=null?Math.max(0,span(a,l)-d.meal):0;return[Math.min(site,r),Math.max(0,site-r),tr]}
 if(d.type=='ecole'&&d.flat)return[r,0,0];
 const w=office(t);return[Math.min(w,r),Math.max(0,w-r),0]}
function evalAll(){const R={},W={},th=S.set.thr*60;
 for(const s in S.days)(W[ws(s)]??=[]).push(s);
 const sp=(x,c)=>{const l=Math.min(x,Math.max(0,th-c.v));c.v+=x;return[l,x-l]};
 for(const k in W){const c={v:0};
  for(const s of W[k].sort()){const d=S.days[s],[n,o,tr]=raw(s,d),e={n,night:d.type=='chantier'&&!!d.night};
   [e.o1,e.o2]=sp(o,c);
   if(S.set.truckIn){[e.c1,e.c2]=sp(tr,c)}else{e.c1=tr;e.c2=0}
   R[s]=e}}
 return R}
const tot=l=>{const t={n:0,o1:0,o2:0,c1:0,c2:0,nt:0};
 for(const s of l){const e=E[s];if(!e)continue;t.n+=e.n;t.o1+=e.o1;t.o2+=e.o2;t.c1+=e.c1;t.c2+=e.c2;if(e.night)t.nt++}return t};
const rw=(a,b)=>`<div class="r"><span>${a}</span><b>${b}</b></div>`;
function sum(t,base){const c=S.set,a=100+c.r1,b=100+c.r2,pe=t.n+(t.o1+t.c1)*(1+c.r1/100)+(t.o2+t.c2)*(1+c.r2/100);
 return rw('Heures normales',hm(t.n)+(base?' / '+hm(base):''))+rw('Heures sup à '+a+' %',hm(t.o1))+rw('Heures sup à '+b+' %',hm(t.o2))
  +rw('Heures de camion à '+a+' %',hm(t.c1))+rw('Heures de camion à '+b+' %',hm(t.c2))
  +rw('Nuits en découcher',t.nt)+rw('Prime de nuit',eur(t.nt*c.bonus))+rw('Total en heures payées',hm(pe))}

/* ---------- Actions ---------- */
const cur=()=>S.days[V.date],done=()=>{save();render()};
function tpl(d){const t=S.set.tpl[wd(V.date)];OI.forEach(k=>delete d.t[k]);if(t.w)OI.forEach(k=>{if(t[k])d.t[k]=t[k]})}
function mk(t){const d={type:t,t:{},meal:S.set.mealStd,red:false,night:false,flat:true,note:''};S.days[V.date]=d;if(t!='chantier')tpl(d);done()}
function ty(t){const d=cur();d.type=t;if(t!='chantier'&&!OI.some(k=>d.t[k]))tpl(d);done()}
function pu(k){cur().t[k]=new Date().toTimeString().slice(0,5);done()}
function setT(k,v){v?cur().t[k]=v:delete cur().t[k];done()}
function up(k,v){cur()[k]=v;done()}
function rd(on){const d=cur();d.red=on;d.meal=on?S.set.mealRed:S.set.mealStd;done()}
function clr(){OI.forEach(k=>delete cur().t[k]);done()}
function ref0(){tpl(cur());done()}
function del(){if(confirm('Supprimer cette journée ?')){delete S.days[V.date];done()}}
function cfg(k,v){S.set[k]=typeof v=='boolean'?v:(+String(v).replace(',','.')||0);done()}
function tc(i,k,v){S.set.tpl[i][k]=v;done()}
function rst(){if(confirm('Effacer toutes les journées ?')){S.days={};done()}}
function csv(){const f=x=>(x/60).toFixed(2).replace('.',','),a=100+S.set.r1,b=100+S.set.r2;
 const L=['Date;Type;Heures normales;Sup '+a+'%;Sup '+b+'%;Camion '+a+'%;Camion '+b+'%;Nuit;Note'];
 Object.keys(S.days).sort().forEach(s=>{const d=S.days[s],e=E[s];L.push([s,TYn[d.type],f(e.n),f(e.o1),f(e.o2),f(e.c1),f(e.c2),e.night?1:0,(d.note||'').replace(/[;\n]/g,' ')].join(';'))});
 const u=URL.createObjectURL(new Blob(['\ufeff'+L.join('\n')],{type:'text/csv'})),k=document.createElement('a');
 k.href=u;k.download='heures.csv';k.click()}

/* ---------- Vues ---------- */
function pv(){const d=cur();
 let h=`<div class="card"><div class="r"><input type="date" value="${V.date}" onchange="V.date=this.value||iso(new Date());render()"><button class="lk" onclick="V.date=iso(new Date());render()">Aujourd’hui</button></div></div>`;
 if(!d)h+=`<h2>${fd(V.date)} : choisis le type de journée</h2>`+Object.entries(TYn).map(([k,n])=>`<button class="big" onclick="mk('${k}')">${n}</button>`).join('');
 else{const c=d.type=='chantier',L=c?LB.c:LB.o,e=E[V.date]||{n:0,o1:0,o2:0,c1:0,c2:0},eh=d.type!='ecole'||!d.flat;
  h+=`<div class="seg">${Object.entries(TYn).map(([k,n])=>`<button class="${d.type==k?'on':''}" onclick="ty('${k}')">${n}</button>`).join('')}</div>`;
  h+=`<h2>Pointage rapide (heure actuelle)</h2><div class="card g">${L.map(([k,n])=>`<button class="pb" onclick="pu('${k}')">${n}<b>${d.t[k]||'—'}</b></button>`).join('')}</div>`;
  h+=`<h2>Horaires</h2><div class="card">`;
  if(d.type=='ecole')h+=`<label class="r"><span>Forfait journalier standard</span><input type="checkbox" ${d.flat?'checked':''} onchange="up('flat',this.checked)"></label>`;
  if(eh)h+=L.map(([k,n])=>`<div class="r"><span>${n}</span><input type="time" value="${d.t[k]||''}" onchange="setT('${k}',this.value)"></div>`).join('');
  if(eh&&!c)h+=`<div class="r"><button class="lk" onclick="ref0()">Horaires de référence</button><button class="lk rd" onclick="clr()">Effacer</button></div>`;
  h+='</div>';
  if(c)h+=`<h2>Repas et nuit</h2><div class="card"><label class="r"><span>Temps de repas réduit</span><input type="checkbox" ${d.red?'checked':''} onchange="rd(this.checked)"></label>
   <div class="r"><span>Pause repas</span><span><input type="number" inputmode="numeric" value="${d.meal}" onchange="up('meal',Math.max(0,+this.value||0))"> min</span></div>
   <label class="r"><span>Nuit sur place (découcher)</span><input type="checkbox" ${d.night?'checked':''} onchange="up('night',this.checked)"></label></div>`;
  h+=`<h2>Récapitulatif du jour</h2><div class="card">${rw('Heures normales',hm(e.n))}${rw('Heures supplémentaires',hm(e.o1+e.o2))}${e.o2?rw('dont à '+(100+S.set.r2)+' %',hm(e.o2)):''}`
   +(c?rw('Heures de camion',hm(e.c1+e.c2))+(d.night?rw('Découcher',eur(S.set.bonus)):'')+((!d.t.arr||!d.t.lea)?'<div class="r"><small>Renseigne l’arrivée et le départ du chantier pour calculer les heures.</small></div>':''):'')+'</div>';
  h+=`<div class="card"><textarea placeholder="Remarque (facultatif)" onchange="up('note',this.value)">${(d.note||'').replace(/</g,'&lt;')}</textarea><div class="r"><button class="lk rd" onclick="del()">Supprimer cette journée</button></div></div>`}
 const w=ws(V.date);
 return h+`<h2>${wt(w)}</h2><div class="card">${sum(tot(Object.keys(S.days).filter(s=>ws(s)==w)),baseMin())}</div>`}

function hv(){const ks=Object.keys(S.days);
 let h=`<div class="seg">${[['j','Jours'],['s','Semaines'],['m','Mois']].map(([k,n])=>`<button class="${V.h==k?'on':''}" onclick="V.h='${k}';render()">${n}</button>`).join('')}</div>`;
 if(!ks.length)return h+'<p class="mu">Aucune journée enregistrée.</p>';
 if(V.h=='m'){for(const mo of [...new Set(ks.map(s=>s.slice(0,7)))].sort().reverse())
   h+=`<h2>${P(mo+'-01').toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</h2><div class="card">${sum(tot(ks.filter(s=>s.startsWith(mo))))}</div>`;
  return h}
 for(const w of [...new Set(ks.map(ws))].sort().reverse()){const l=ks.filter(s=>ws(s)==w).sort().reverse();
  h+=`<h2>${wt(w)}</h2><div class="card">`;
  h+=V.h=='s'?sum(tot(l),baseMin()):l.map(s=>{const e=E[s],d=S.days[s],o=e.o1+e.o2,c=e.c1+e.c2;
   return `<div class="r tap" onclick="V.date='${s}';V.tab='p';render()"><span>${fd(s)}<br><small>${TYn[d.type]}</small></span><span style="text-align:right">${hm(e.n)}${e.night?' 🌙':''}<br><small>${o?'sup '+hm(o):''}${o&&c?' · ':''}${c?'camion '+hm(c):''}</small></span></div>`}).join('');
  h+='</div>'}
 return h}

function sv(){const c=S.set,n=(k,l,u)=>`<div class="r"><span>${l}</span><span><input type="number" inputmode="decimal" step="any" value="${c[k]}" onchange="cfg('${k}',this.value)"> ${u}</span></div>`;
 let h=`<h2>Prime de nuit (découcher)</h2><div class="card">${n('bonus','Montant par nuit','€')}</div>
 <h2>Majorations hebdomadaires</h2><div class="card">${n('thr','Seuil d’heures sup','h / sem.')}${n('r1','Majoration de base','%')}${n('r2','Majoration au-delà du seuil','%')}
 <label class="r"><span>Camion compté dans le seuil</span><input type="checkbox" ${c.truckIn?'checked':''} onchange="cfg('truckIn',this.checked)"></label></div>
 <h2>Repas sur chantier</h2><div class="card">${n('mealStd','Repas standard','min')}${n('mealRed','Repas réduit','min')}</div>
 <h2>Horaires de référence · ${hm(baseMin())} par semaine</h2><div class="card">`;
 JN.forEach((j,i)=>{const t=c.tpl[i];h+=`<div class="tp"><label><input type="checkbox" ${t.w?'checked':''} onchange="tc(${i},'w',this.checked)"> <b>${j}</b></label>`
  +(t.w?OI.map((k,x)=>`<input type="time" title="${LB.o[x][1]}" value="${t[k]||''}" onchange="tc(${i},'${k}',this.value)">`).join(''):'')+'</div>'});
 return h+`</div><p class="mu" style="margin:4px 6px">Dans l’ordre : arrivée, début de pause, fin de pause, départ.</p>
 <h2>Données</h2><div class="card"><div class="r"><button class="lk" onclick="csv()">Exporter en CSV</button></div><div class="r"><button class="lk rd" onclick="rst()">Tout effacer</button></div></div>`}

function render(){E=evalAll();$('#app').innerHTML=V.tab=='p'?pv():V.tab=='h'?hv():sv();
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==V.tab))}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
navigator.storage&&navigator.storage.persist&&navigator.storage.persist();
</script>
</body>
</html>
