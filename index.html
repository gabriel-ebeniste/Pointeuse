<style>

<div id="ws"><div class="bd" onclick="wc()"></div><div class="sh">
<div class="sb"><button class="lk" onclick="wc()">Annuler</button><button class="lk rd" onclick="wset('')">Effacer l’heure</button><button class="lk" onclick="wok()"><b>OK</b></button></div>

<script>
const K='suiviheures.v1',$=s=>document.querySelector(s),p=n=>String(n).padStart(2,'0'),cl=x=>JSON.parse(JSON.stringify(x));
const T=(s,lo,li,e,w=1)=>({w,s,lo,li,e}),D4=()=>T('08:15','12:00','13:00','17:00'),FR=(w=1)=>T('08:15','','','12:15',w),E8=()=>T('08:00','12:00','13:45','17:45');
const DEF={bonus:10,nuit:100,rate:0,thr:8,r1:25,r2:50,mealStd:60,mealRed:30,acc:'#e8590c',theme:'auto',
 tpl:[D4(),D4(),D4(),D4(),FR(),FR(0),FR(0)],
 tplE:[T('09:00','12:00','13:45','17:45'),E8(),E8(),E8(),T('08:00','','','12:00'),T('08:00','','','12:00',0),T('08:00','','','12:00',0)]};
let S,A={},E={};
try{const o=JSON.parse(localStorage[K]);S={days:o.days||{},set:{...cl(DEF),...o.set},since:o.since,v:o.v}}catch(e){S={days:{},set:cl(DEF),v:4}}
const save=()=>{localStorage[K]=JSON.stringify(S)};
const V={tab:'p',date:null,cm:null,h:'m'};

const m=t=>t?+t.slice(0,2)*60+ +t.slice(3,5):null;
const hm=x=>{x=Math.max(0,Math.round(x));return Math.floor(x/60)+'h'+p(x%60)};

const TYn={normal:'Atelier',chantier:'Chantier',ecole:'École',cp:'Congé'},JN=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];

const qs=(v,on,ti,df)=>`<button class="tb" ${ti?`title="${ti}" `:''}data-v="${v}" data-df="${df||''}" data-on="${on}" onclick="wh(this)">${v?hl(v):'—'}</button>`;
const DFT={s:'08:15',lo:'12:00',li:'13:00',e:'17:00',dep:'05:45',arr:'08:00',lea:'17:00',ret:'19:00'};
const OI=['s','lo','li','e'],CI=['dep','arr','lea','ret'];
const PAL=[['Orange','#e8590c'],['Bleu','#0a84ff'],['Vert','#2f9e44'],['Rouge','#e03131'],['Violet','#7048e8'],['Rose','#d6336c'],['Turquoise','#0c8599'],['Ambre','#d98200'],['Ardoise','#495057']];

/* ---------- Calculs ---------- */
const span=(a,b)=>a==null||b==null?0:b>=a?b-a:b+1440-a;
const tm=t=>!t.w?0:(t.lo&&t.li?m(t.lo)-m(t.s)+m(t.e)-m(t.li):m(t.e)-m(t.s))||0;
const ref=s=>Math.max(0,tm(S.set.tpl[wd(s)]));
const baseMin=k=>S.set[k||'tpl'].reduce((a,t)=>a+Math.max(0,tm(t)),0);
function office(t){const s=m(t.s),lo=m(t.lo),li=m(t.li),e=m(t.e);if(s==null)return 0;
 if(lo!=null){let x=Math.max(0,lo-s);if(li!=null&&e!=null)x+=Math.max(0,e-li);return x}
 return e!=null?Math.max(0,e-s):0}
function raw(s,d){const t=d.t,r=ref(s),ex=(d.x||[]).reduce((a,q)=>a+span(m(q.s),m(q.e)),0),o={n:0,o:0,tr:0,cp:0,rc:d.rh||0};
 if(d.type=='chantier'){const a=m(t.arr),l=m(t.lea),site=a!=null&&l!=null?Math.max(0,span(a,l)-d.meal):0;
  o.n=Math.min(site,r);o.o=Math.max(0,site-r)+ex;o.tr=(d.ng?0:span(m(t.dep),a))+(d.nb?0:span(l,m(t.ret)))}
 else if(d.type=='ecole')o.n=office(t);
 else if(d.type=='cp')o.cp=d.h??r;
 else{const w=office(t);o.n=Math.min(w,r);o.o=Math.max(0,w-r)+ex}
 return o}
function tpl(d,s){const t=S.set[d.type=='ecole'?'tplE':'tpl'][wd(s)];OI.forEach(k=>delete d.t[k]);if(t.w)OI.forEach(k=>{if(t[k])d.t[k]=t[k]})}
function vd(s){const d={type:'normal',t:{},x:[],meal:S.set.mealStd,red:false,night:false,nw:false,ng:0,nb:0,rh:0};tpl(d,s);return d}
const elig=s=>S.set.tpl[wd(s)].w&&s>=S.since&&s<=TD();
function all(){const R={};for(let s=S.since,n=0;s<=TD()&&n<800;s=addD(s,1),n++)if(elig(s))R[s]=vd(s);return Object.assign(R,S.days)}
function evalAll(){const R={},W={},th=S.set.thr*60;
 for(const s in A)(W[ws(s)]??=[]).push(s);
 for(const k in W){let cum=0;
  for(const s of W[k].sort()){const d=A[s],o=raw(s,d),l=Math.min(o.o,Math.max(0,th-cum));cum+=o.o;
   R[s]={n:o.n,cp:o.cp,rec:o.rc,o1:l,o2:o.o-l,c1:o.tr,c2:0,night:d.type=='chantier'&&!!d.night&&!d.nw,nw:d.type=='chantier'&&!!d.nw}}}
 return R}
const tot=l=>{const t={n:0,cp:0,rec:0,o1:0,o2:0,c1:0,c2:0,nt:0,nn:0};
 for(const s of l){const e=E[s];if(!e)continue;for(const k of['n','cp','rec','o1','o2','c1'])t[k]+=e[k];if(e.night)t.nt++;if(e.nw)t.nn++}return t};
function net(t){const f1=1+S.set.r1/100,f2=1+S.set.r2/100;let r=t.rec;
 const d2=Math.min(t.o2,r/f2);r-=d2*f2;const d1=Math.min(t.o1,r/f1);r-=d1*f1;
 return{o1:t.o1-d1,o2:t.o2-d2,ex:Math.max(0,r)}}
const rw=(a,b)=>`<div class="r"><span>${a}</span><b>${b}</b></div>`;
function sumC(t,base){const c=S.set,a=100+c.r1,b=100+c.r2,q=net(t),pn=t.n+t.cp+t.rec;
 let h=base?rw('Heures normales',hm(t.n)+' / '+hm(base)):'';
 if(t.cp)h+=rw('Congés payés',hm(t.cp));
 h+=rw('Heures sup à '+a+' %',hm(t.o1))+rw('Heures sup à '+b+' %',hm(t.o2));
 if(t.rec){h+=rw('Récupérations prises',hm(t.rec))+rw('Heures sup restantes à '+a+' %',hm(q.o1))+rw('Heures sup restantes à '+b+' %',hm(q.o2));
  if(q.ex>0)h+=rw('Récup non couverte par les heures sup',hm(q.ex))}
 h+=rw('Heures de camion à '+a+' %',hm(t.c1));
 const pd=t.nt*c.bonus,pnu=t.nn*c.nuit;let e='';
 if(c.rate>0){const e1=pn/60*c.rate,e2=((q.o1+t.c1)*(1+c.r1/100)+q.o2*(1+c.r2/100))/60*c.rate;
  e+=rw('Heures normales',eur(e1))+rw('Heures sup et camion',eur(e2))}
 e+=rw('Prime de découchage',eur(pd))+rw('Prime de nuit',eur(pnu));
 if(c.rate>0)e+=rw('Total estimé (brut)',eur(pn/60*c.rate+((q.o1+t.c1)*(1+c.r1/100)+q.o2*(1+c.r2/100))/60*c.rate+pd+pnu));
 return `<div class="card">${h}</div><h2>En euros (estimation)</h2><div class="card">${e}</div>`}

/* ---------- Roue d'heure ---------- */
let W={on:''};const IH=34;
(function(){$('#wH').innerHTML=Array.from({length:24},(_,i)=>`<div>${i} h</div>`).join('');$('#wM').innerHTML=[0,15,30,45].map(x=>`<div>${p(x)} min</div>`).join('')})();
function wh(b){W.on=b.dataset.on;const v=b.dataset.v||b.dataset.df||'08:00',s=()=>{$('#wH').scrollTop=+v.slice(0,2)*IH;$('#wM').scrollTop=Math.round(+v.slice(3)/15)*IH};
 $('#ws').style.display='block';document.body.style.overflow='hidden';s();requestAnimationFrame(s)}
function wc(){$('#ws').style.display='none';document.body.style.overflow=''}
function wset(v){wc();new Function(W.on).call({value:v})}
function wok(){const c=(id,mx)=>Math.min(mx,Math.max(0,Math.round($(id).scrollTop/IH)));wset(p(c('#wH',23))+':'+p(c('#wM',3)*15))}

/* ---------- Actions ---------- */
const ens=()=>S.days[V.date]||(S.days[V.date]=cl(A[V.date])),done=()=>{save();render()};
const go=s=>{V.date=s;V.cm=s.slice(0,7);V.tab='p';render()};
function cmv(k){const d=P(V.cm+'-01');d.setMonth(d.getMonth()+k);V.cm=iso(d).slice(0,7);render()}
function mk(t){const d={type:t,t:{},x:[],meal:S.set.mealStd,red:false,night:false,nw:false,ng:0,nb:0,rh:0};S.days[V.date]=d;if(t=='normal'||t=='ecole')tpl(d,V.date);done()}
function ty(t){const d=ens();d.type=t;if(t=='chantier')OI.forEach(k=>delete d.t[k]);else{CI.forEach(k=>delete d.t[k]);d.ng=d.nb=0}
 if(t=='normal'||t=='ecole')tpl(d,V.date);if(t=='ecole')d.x=[];done()}
function setT(k,v){const d=ens();v?d.t[k]=v:delete d.t[k];done()}
function up(k,v){ens()[k]=v;done()}
function pr(k,on){const d=ens();d.night=false;d.nw=false;if(on)d[k]=true;done()}
function fl(k,v){const d=ens();d[k]=v;if(v)delete d.t[k=='ng'?'dep':'ret'];done()}
function rd(on){const d=ens();d.red=on;d.meal=on?S.set.mealRed:S.set.mealStd;done()}
function rc(on){const d=ens();if(on){d.rh=ref(V.date);if(d.type=='normal')OI.forEach(k=>delete d.t[k])}else{d.rh=0;if(d.type=='normal'&&!OI.some(k=>d.t[k]))tpl(d,V.date)}done()}
function ax(){const d=ens(),l=(d.x||[]).slice(-1)[0];(d.x=d.x||[]).push({s:(l&&l.e)||d.t.ret||d.t.e||'',e:''});done()}
function rx(i){ens().x.splice(i,1);done()}
function sx(i,k,v){ens().x[i][k]=v;done()}
function rf(){tpl(ens(),V.date);done()}
function clr(){const d=ens();OI.forEach(k=>delete d.t[k]);done()}
function del(){if(confirm(elig(V.date)?'Rétablir la journée normale par défaut ?':'Supprimer cette journée ?')){delete S.days[V.date];done()}}
function cfg(k,v){S.set[k]=(+String(v).replace(',','.')||0);done()}
function set2(k,v){S.set[k]=v;done()}
function tc(k,i,f,v){S.set[k][i][f]=v;done()}
function rst(){if(confirm('Effacer toutes les saisies (les journées atelier par défaut reviendront) ?')){S.days={};done()}}
function maj(){const r=navigator.serviceWorker?navigator.serviceWorker.getRegistrations():Promise.resolve([]);r.then(x=>Promise.all(x.map(y=>y.unregister()))).then(()=>window.caches?caches.keys():[]).then(k=>Promise.all(k.map(y=>caches.delete(y)))).then(()=>location.reload())}
function csv(){const f=x=>(x/60).toFixed(2).replace('.',','),a=100+S.set.r1,b=100+S.set.r2;
 const L=['Date;Type;Heures normales;Congés;Récup;Sup '+a+'%;Sup '+b+'%;Camion '+a+'%;Découchage;Nuit'];
 Object.keys(A).sort().forEach(s=>{const e=E[s];L.push([s,TYn[A[s].type],f(e.n),f(e.cp),f(e.rec),f(e.o1),f(e.o2),f(e.c1),e.night?1:0,e.nw?1:0].join(';'))});
 const u=URL.createObjectURL(new Blob(['\ufeff'+L.join('\n')],{type:'text/csv'})),k=document.createElement('a');k.href=u;k.download='heures.csv';k.click()}
function pdf(){const J=window.jspdf&&window.jspdf.jsPDF;if(!J){alert('Le module PDF n’est pas chargé : ouvre l’app avec du réseau, puis réessaie.');return}
 const mo=V.cm,ks=Object.keys(A).filter(s=>s.startsWith(mo)).sort(),t=tot(ks),c=S.set,q=net(t),doc=new J(),X=v=>v.toFixed(2).replace('.',',')+' EUR',a=100+c.r1,b=100+c.r2;
 let y=18;const pg=()=>{if(y>textMax){doc.addPage();y=18}},textMax=280;
 const row=(r,cols)=>{pg();r.forEach((v,i)=>doc.text(String(v),cols[i],y));y+=6};
 doc.setFontSize(16);doc.text('Suivi des heures - '+fm(mo),14,y);y+=10;doc.setFontSize(10);
 const C=[14,58,92,118,144,168];doc.setFont('helvetica','bold');row(['Date','Type','Normales','Sup','Camion','Primes'],C);doc.setFont('helvetica','normal');
 ks.forEach(s=>{const e=E[s],d=A[s];row([fds(s),TYn[d.type]+(d.rh?' + recup':''),hm(e.n+e.cp),hm(e.o1+e.o2),hm(e.c1),(e.night?'Decouch. ':'')+(e.nw?'Nuit':'')],C)});
 y+=6;doc.setFont('helvetica','bold');row(['Recapitulatif'],[14]);doc.setFont('helvetica','normal');
 const R=[['Heures sup a '+a+' %',hm(t.o1)],['Heures sup a '+b+' %',hm(t.o2)]];
 if(t.rec)R.push(['Recuperations prises',hm(t.rec)],['Sup restantes a '+a+' %',hm(q.o1)],['Sup restantes a '+b+' %',hm(q.o2)]);
 R.push(['Heures de camion a '+a+' %',hm(t.c1)],['Prime de decouchage',X(t.nt*c.bonus)],['Prime de nuit',X(t.nn*c.nuit)]);
 if(c.rate>0){const e2=((q.o1+t.c1)*(1+c.r1/100)+q.o2*(1+c.r2/100))/60*c.rate,e1=(t.n+t.cp+t.rec)/60*c.rate;R.push(['Heures normales (estim.)',X(e1)],['Sup et camion (estim.)',X(e2)],['Total estime (brut)',X(e1+e2+t.nt*c.bonus+t.nn*c.nuit)])}
 R.forEach(r=>row(r,[14,100]));
 const f=new File([doc.output('blob')],'heures-'+mo+'.pdf',{type:'application/pdf'});
 if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});else doc.save(f.name)}

/* ---------- Vues ---------- */
const lab=(d,e)=>d&&e?(({chantier:'Ch',ecole:'Éc',cp:'CP'})[d.type]||'')+(d.rh?' R':'')+(e.o1+e.o2>0?' +':''):'';
function calv(){const cm=V.cm,off=wd(cm+'-01'),[y,mo]=cm.split('-').map(Number),n=new Date(y,mo,0).getDate();
 let h=`<div class="card"><div class="ch"><button onclick="cmv(-1)">‹</button><b>${fm(cm)}</b><button onclick="cmv(1)">›</button></div><div class="cal">`+['L','M','M','J','V','S','D'].map(x=>`<i>${x}</i>`).join('');
 for(let i=0;i<off;i++)h+='<span></span>';
 for(let i=1;i<=n;i++){const s=cm+'-'+p(i);h+=`<button class="${s==V.date?'sel':''}${s==TD()?' td':''}${wd(s)>4?' we':''}" onclick="go('${s}')">${i}<small>${lab(A[s],E[s])}</small></button>`}
 return h+'</div></div>'}
function pv(){const d=A[V.date];
 let h=calv();
 if(!d)h+=`<h2>${fd(V.date)} : choisis le type de journée</h2>`+Object.entries(TYn).map(([k,n])=>`<button class="big" onclick="mk('${k}')">${n}</button>`).join('');
 else{const c=d.type=='chantier',lv=d.type=='cp',e=E[V.date],L=c?LB.c:LB.o,hid=k=>(k=='dep'&&d.ng)||(k=='ret'&&d.nb);
  h+=`<h2>${fd(V.date)}</h2><div class="seg">${Object.entries(TYn).map(([k,n])=>`<button class="${d.type==k?'on':''}" onclick="ty('${k}')">${n}</button>`).join('')}</div>`;
  if(lv)h+=`<div class="card"><div class="r"><span>Durée du congé</span><span><input type="number" inputmode="decimal" step="0.25" value="${(d.h??ref(V.date))/60}" onchange="up('h',Math.max(0,Math.round((+String(this.value).replace(',','.')||0)*60)))"> h</span></div></div>`;
  else{
   h+=`<div class="card">`+L.map(([k,n])=>hid(k)?'':`<div class="r"><span class="lb">${k=='dep'?`<button class="mb" onclick="fl('ng',1)">−</button>`:k=='ret'?`<button class="mb" onclick="fl('nb',1)">−</button>`:'<span class="sp"></span>'}${n}</span>${qs(d.t[k]||'',`setT('${k}',this.value)`,'',DFT[k])}</div>`).join('');
   if(c&&d.ng)h+=`<div class="r"><span class="lb"><button class="mb pl" onclick="fl('ng',0)">+</button>Rétablir le trajet aller</span></div>`;
   if(c&&d.nb)h+=`<div class="r"><span class="lb"><button class="mb pl" onclick="fl('nb',0)">+</button>Rétablir le trajet retour</span></div>`;
   if(d.type!='ecole')h+=`<div class="cap">Heures sup en plus (débriefing, déchargement…)</div>`+(d.x||[]).map((q,i)=>`<div class="r"><span class="lb"><button class="mb" onclick="rx(${i})">−</button>Sup ${i+1}</span><span>${qs(q.s||'',`sx(${i},'s',this.value)`,'','18:00')} ${qs(q.e||'',`sx(${i},'e',this.value)`,'',q.s||'19:00')}</span></div>`).join('')+`<div class="r"><span class="lb"><button class="mb pl" onclick="ax()">+</button>Ajouter une ligne</span></div>`;
   if(!c)h+=`<div class="r"><button class="lk" onclick="rf()">${d.type=='ecole'?'Horaires école':'Horaires de référence'}</button><button class="lk rd" onclick="clr()">Effacer</button></div>`;
   h+='</div><h2>Options de la journée</h2><div class="card">';
   if(c)h+=`<label class="r"><span>Temps de repas réduit</span><input type="checkbox" ${d.red?'checked':''} onchange="rd(this.checked)"></label>
    <div class="r"><span>Pause repas</span><span><input type="number" inputmode="numeric" value="${d.meal}" onchange="up('meal',Math.max(0,+this.value||0))"> min</span></div>
    <label class="r"><span>Nuit sur place</span><input type="checkbox" ${d.night?'checked':''} onchange="pr('night',this.checked)"></label>
    <label class="r"><span>Chantier de nuit</span><input type="checkbox" ${d.nw?'checked':''} onchange="pr('nw',this.checked)"></label>`;
   h+=`<label class="r"><span>Récupération</span><input type="checkbox" ${d.rh>0?'checked':''} onchange="rc(this.checked)"></label>`;
   if(d.rh>0)h+=`<div class="r"><span>Durée de la récup</span><span><input type="number" inputmode="decimal" step="0.25" value="${d.rh/60}" onchange="up('rh',Math.max(0,Math.round((+String(this.value).replace(',','.')||0)*60)))"> h</span></div>`;
   h+='</div>'}
  h+=`<h2>Récapitulatif du jour</h2><div class="card">`+(lv?rw('Congé payé',hm(e.cp)):rw('Heures supplémentaires',hm(e.o1+e.o2))+(e.o2?rw('dont à '+(100+S.set.r2)+' %',hm(e.o2)):'')
   +(e.rec?rw('Récupération',hm(e.rec)):'')+(c?rw('Heures de camion',hm(e.c1))+(d.night?rw('Prime de découchage',eur(S.set.bonus)):'')+(d.nw?rw('Prime de nuit',eur(S.set.nuit)):'')+((!d.t.arr||!d.t.lea)?'<div class="r"><small>Renseigne l’arrivée et le départ du chantier pour calculer les heures.</small></div>':''):''))+'</div>';
  if(S.days[V.date])h+=`<div class="card"><div class="r"><button class="lk rd" onclick="del()">${elig(V.date)?'Rétablir la journée atelier par défaut':'Supprimer cette journée'}</button></div></div>`}
 const mo=V.cm;
 return h+`<h2>Récapitulatif · ${fm(mo)}</h2>${sumC(tot(Object.keys(A).filter(s=>s.startsWith(mo))))}`}

function hv(){const ks=Object.keys(A);
 let h=`<div class="seg">${[['m','Mois'],['s','Semaines'],['j','Jours']].map(([k,n])=>`<button class="${V.h==k?'on':''}" onclick="V.h='${k}';render()">${n}</button>`).join('')}</div>`;
 if(!ks.length)return h+'<p class="mu">Aucune journée enregistrée.</p>';
 if(V.h=='m'){for(const mo of [...new Set(ks.map(s=>s.slice(0,7)))].sort().reverse())
   h+=`<h2>${fm(mo)}</h2>${sumC(tot(ks.filter(s=>s.startsWith(mo))))}`;return h}
 for(const w of [...new Set(ks.map(ws))].sort().reverse()){const l=ks.filter(s=>ws(s)==w).sort().reverse();
  h+=`<h2>${wt(w)}</h2>`;
  h+=V.h=='s'?sumC(tot(l),baseMin()):'<div class="card">'+l.map(s=>{const e=E[s],d=A[s],o=e.o1+e.o2,c=e.c1;
   return `<div class="r tap" onclick="go('${s}')"><span>${fds(s)}<br><small>${TYn[d.type]}${d.rh?' + récup':''}</small></span><span style="text-align:right">${hm(e.n+e.cp)}${e.night?' 🛏':''}${e.nw?' 🌙':''}<br><small>${o?'sup '+hm(o):''}${o&&c?' · ':''}${c?'camion '+hm(c):''}</small></span></div>`}).join('')+'</div>'}
 return h}

function tpb(k,t){let h=`<h2>${t} · ${hm(baseMin(k))} par semaine</h2><div class="card">`;
 JN.forEach((j,i)=>{const o=S.set[k][i];h+=`<div class="tp"><label><input type="checkbox" ${o.w?'checked':''} onchange="tc('${k}',${i},'w',this.checked)"> <b>${j}</b></label>`
  +(o.w?OI.map((f,x)=>`${qs(o[f]||'',`tc('${k}',${i},'${f}',this.value)`,LB.o[x][1],DFT[f])}`).join(''):'')+'</div>'});
 return h+'</div>'}
function sv(){const c=S.set,n=(k,l,u)=>`<div class="r"><span>${l}</span><span><input type="number" inputmode="decimal" step="any" value="${c[k]}" onchange="cfg('${k}',this.value)"> ${u}</span></div>`;
 return `<h2>Paie</h2><div class="card">${n('rate','Taux horaire brut','€ / h')}${n('bonus','Prime de découchage (par nuit)','€')}${n('nuit','Prime de nuit (chantier de nuit)','€')}</div>
 <h2>Apparence</h2><div class="card"><div class="cap">Couleur de l’application</div><div class="sw">${PAL.map(([nm,x])=>`<button class="${c.acc==x?'on':''}" style="background:${x}" title="${nm}" onclick="set2('acc','${x}')"></button>`).join('')}</div>
 <div class="seg" style="margin:0 0 12px">${[['auto','Auto'],['light','Clair'],['dark','Sombre']].map(([k,nm])=>`<button class="${c.theme==k?'on':''}" onclick="set2('theme','${k}')">${nm}</button>`).join('')}</div></div>
 <h2>Majorations hebdomadaires</h2><div class="card">${rw('Seuil d’heures sup',c.thr+' h par semaine')}${rw('Majoration de base','+'+c.r1+' %')}${rw('Au-delà du seuil','+'+c.r2+' %')}</div>
 <h2>Remplissage automatique</h2><div class="card"><div class="r"><span>Journées atelier dès le</span><input type="date" value="${S.since}" onchange="S.since=this.value||S.since;done()"></div></div>
 ${tpb('tpl','Horaires atelier')}${tpb('tplE','Horaires école')}
 <p class="mu" style="margin:4px 6px">Dans l’ordre : arrivée, début de pause, fin de pause, départ.</p>
 <h2>Données</h2><div class="card"><div class="r"><button class="lk" onclick="maj()">Forcer la mise à jour</button><small>Version 7</small></div><div class="r"><button class="lk" onclick="csv()">Exporter en CSV</button></div><div class="r"><button class="lk" onclick="pdf()">Exporter en PDF</button><small>${fm(V.cm)}</small></div><div class="r"><button class="lk rd" onclick="rst()">Tout effacer</button></div></div>`}

function ap(){const r=document.documentElement,c=S.set.acc||'#e8590c',n=parseInt(c.slice(1),16);
 r.style.setProperty('--a',c);r.style.setProperty('--at','rgba('+(n>>16)+','+(n>>8&255)+','+(n&255)+',.18)');
 if(S.set.theme&&S.set.theme!='auto')r.dataset.theme=S.set.theme;else delete r.dataset.theme;
 const mt=$('meta[name=theme-color]');if(mt)mt.content=c}
function render(){ap();A=all();E=evalAll();$('#app').innerHTML=V.tab=='p'?pv():V.tab=='h'?hv():sv();
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==V.tab))}
/* migration */
(function(){if(S.v!=4){S.v=4;if(!S.set.bonus)S.set.bonus=10;
  for(const s in S.days){const d=S.days[s];d.x=d.x||[];delete d.note;
   if(d.type=='rec'){d.rh=d.h??ref(s);d.type='normal';d.t={};delete d.h}
   if(d.type=='ecole'&&!OI.some(k=>d.t[k]))tpl(d,s)}}
 if(!S.since){const ks=Object.keys(S.days).sort(),f=TD().slice(0,8)+'01';S.since=ks.length&&ks[0]<f?ks[0].slice(0,8)+'01':f}
 save()})();
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
navigator.storage&&navigator.storage.persist&&navigator.storage.persist();
</script>
